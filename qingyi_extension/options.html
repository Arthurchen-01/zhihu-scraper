<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清一新教育 · 修改助手 — 设置</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --panel-2:#f1f5f9; --line:#e2e8f0;
    --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
    --brand:#0ea5e9; --brand-2:#0284c7; --ok:#10b981;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 20px;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:560px;margin:0 auto}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .hd img{width:34px;height:34px;border-radius:8px}
  h1{font-size:17px;margin:0}
  .sub{font-size:12px;color:var(--text-3)}
  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
  .hint{font-size:12px;color:var(--text-3);margin-bottom:6px}
  input[type=text],input[type=number]{
    width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;font:13px/1.4 inherit;color:var(--text);
    background:var(--panel-2);
  }
  input:focus{outline:2px solid #bae6fd;border-color:var(--brand)}
  .f{margin-bottom:16px}
  .chk{display:flex;align-items:flex-start;gap:9px;font-size:13px}
  .chk input{margin-top:3px}
  .btns{display:flex;gap:10px;align-items:center;margin-top:4px}
  button{
    border:0;border-radius:10px;padding:10px 18px;
    font:600 13.5px/1 inherit;cursor:pointer;
  }
  .b-main{background:var(--brand);color:#fff}
  .b-main:hover{background:var(--brand-2)}
  .b-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
  .b-ghost:hover{background:var(--panel-2)}
  .msg{font-size:12.5px;margin-left:4px}
  .msg.ok{color:#047857}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .kv{font-size:12.5px;color:var(--text-2);background:var(--panel-2);
    border-radius:9px;padding:10px 12px;word-break:break-all}
  code{background:#e2e8f0;border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <img src="icons/icon-128.png" alt="">
    <div>
      <h1>清一新教育 · 修改助手</h1>
      <div class="sub">把本浏览器的知乎登录同步到控制台凭证柜</div>
    </div>
  </div>

  <div class="card">
    <div class="f">
      <label for="server">控制台地址</label>
      <div class="hint">默认即可，除非你们换了自己的站点。</div>
      <input type="text" id="server" placeholder="https://zh.samuraiguan.cloud">
    </div>

    <div class="f">
      <label for="key">站点密钥</label>
      <div class="hint">与控制台页面用的是同一个（默认已填好）。</div>
      <input type="text" id="key" placeholder="guanjun2026">
    </div>

    <div class="f">
      <label for="interval">自动刷新间隔（分钟）</label>
      <div class="hint">云端凭证保留 6 小时，默认每 30 分钟刷新一次。</div>
      <input type="number" id="interval" min="5" max="360" step="5">
    </div>

    <div class="f">
      <label class="chk">
        <input type="checkbox" id="auto">
        <span>开启自动同步（浏览器启动时、登录态变化时、按上面的间隔定期同步）</span>
      </label>
    </div>

    <div class="btns">
      <button class="b-main" id="save">保存设置</button>
      <button class="b-ghost" id="test">立即同步一次</button>
      <span class="msg" id="msg"></span>
    </div>

    <hr>
    <div class="kv" id="status">正在读取…</div>
  </div>
</div>
<script src="config.js"></script>
<script src="options.js"></script>
</body>
</html>
