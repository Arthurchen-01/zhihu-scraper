<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="scraperGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="scraperGradAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="scraperGradCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer subtle hexagon contour -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" fill="none" stroke="url(#scraperGradMain)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 4" />
  
  <!-- Top S-Arc / Cyber Harvester Arm -->
  <path d="M 98,30 L 46,30 C 35,30 26,38 26,48 C 26,58 35,64 48,66 L 76,70 C 90,72 98,78 98,90 C 98,101 88,108 74,108 L 26,108" fill="none" stroke="url(#scraperGradMain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner High-Velocity Core Stream -->
  <path d="M 94,30 L 50,30 C 40,30 34,36 34,46 C 34,54 42,60 54,62 L 78,66 C 88,68 92,74 92,84 C 92,93 84,98 72,98 L 32,98" fill="none" stroke="url(#scraperGradCore)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Cybernetic Scraper Sensor Nodes -->
  <circle cx="98" cy="30" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="26" cy="108" r="5" fill="#10b981" filter="url(#neonGlow)" />
  <polygon points="64,58 72,66 64,74 56,66" fill="url(#scraperGradAccent)" filter="url(#neonGlow)" />

  <!-- Radar Scanning Crossbars -->
  <line x1="38" y1="18" x2="90" y2="18" stroke="url(#scraperGradMain)" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
  <line x1="18" y1="64" x2="28" y2="64" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="100" y1="64" x2="110" y2="64" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>